<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/CSS/bootstrap.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body class="d-flex vh-100 align-items-center justify-content-center">
    <div
      class="d-flex gap-3 flex-column justify-content-center align-items-center bg-black rounded-5 p-5 h-75"
    >
      <h1 class="text-danger fw-bold bg-dark rounded-4 p-3">Translator App</h1>
      <div class="d-flex gap-sm-5 gap-3 h-75 flex-sm-row flex-column">
        <div class="d-flex gap-sm-5 gap-3 flex-column h-100">
          <textarea
            class="rounded bg-secondary h-75"
            name=""
            id="origin-text"
          ></textarea>
          <select id="language-translate-from" class="btn btn-info"></select>
        </div>
        <div class="d-flex gap-sm-5 gap-3 flex-column h-100">
          <textarea
            class="rounded bg-dark h-75"
            disabled
            name=""
            id="translated-text"
          ></textarea>
          <select id="language-translate-into" class="btn btn-info"></select>
        </div>
      </div>
      <button class="btn btn-outline-info translate">translate</button>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
