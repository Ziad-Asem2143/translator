<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/CSS/bootstrap.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body class="d-flex vh-100 align-items-center justify-content-center">
    <div
      class="d-flex gap-3 flex-column justify-content-center align-items-center h-75 bg-black rounded-5 w-50"
    >
      <h1 class="text-danger fw-bold bg-dark rounded-4 p-3">Translator App</h1>
      <div class="d-flex gap-5">
        <textarea
          class="rounded bg-secondary"
          cols="20"
          rows="10"
          name=""
          id="origin-text"
        ></textarea>
        <textarea
          class="rounded bg-dark"
          disabled
          cols="20"
          rows="10"
          name=""
          id="translated-text"
        ></textarea>
      </div>
      <div>
        <select id="language-translate-from" class="btn btn-info"></select>
        <select id="language-translate-into" class="btn btn-info"></select>
      </div>
      <button class="btn btn-outline-info translate">translate</button>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
